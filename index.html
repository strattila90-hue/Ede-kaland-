<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141822">
<meta name="description" content="Családi autós kalandjáték: Komáromtól Európán át, valós távolságokkal, fogyasztással és forinttal.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Családi Vakáció">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Családi Vakáció</title>
<style>
html,body{margin:0;height:100%;background:#141822;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.tb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:16px;background:rgba(20,24,34,.38);border:2px solid rgba(255,255,255,.5);color:#fff;font:700 13px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(255,255,255,.4)}
.sm{width:44px;height:44px;font-size:12px;border-radius:12px}
#rot{position:fixed;left:0;right:0;top:12px;display:none;justify-content:center;color:#fff;font:700 15px system-ui;text-align:center;pointer-events:none;z-index:9}
#rot span{background:rgba(10,12,20,.85);padding:8px 12px;border-radius:10px}
#appbar{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:8px;z-index:6;width:178px}
#appbar button{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.35);background:rgba(16,20,30,.78);color:#fff;border-radius:12px;padding:10px 12px;font:600 14px system-ui,sans-serif;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
#appbar button:active{transform:scale(.97)}
#appbar button .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2e8b57,#5bd06a);opacity:.85;transition:width .15s}
#appbar button .lbl{position:relative}
#appbar button.new{border-color:#ffd84a;box-shadow:0 0 0 2px rgba(255,216,74,.35)}
#ver{color:#9fb0c2;font:600 12px system-ui;padding-left:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(16,20,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font:600 14px system-ui;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:86vw;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
 <div class="tb" id="bUp" style="left:14px;bottom:84px">▲</div>
 <div class="tb" id="bDn" style="left:14px;bottom:16px">▼</div>
 <div class="tb" id="bBr" style="left:80px;bottom:16px">FÉK</div>
 <div class="tb" id="bGas" style="right:14px;bottom:16px">GÁZ</div>
 <div class="tb" id="bHonk" style="right:80px;bottom:16px">DUDA</div>
 <div class="tb sm" id="bHaz" style="right:14px;bottom:84px">⚠</div>
 <div class="tb sm" id="bPause" style="right:14px;top:56px">II</div>
 <div class="tb sm" id="bMus" style="right:64px;top:56px">♪</div>
 <div class="tb sm" id="bLight" style="right:114px;top:56px">💡</div>
 <div class="tb sm" id="bFog" style="right:164px;top:56px">KÖD</div>
</div>
<div id="appbar">
 <button id="aInstall"><span class="lbl">⬇ Telepítés</span></button>
 <button id="aShare"><span class="lbl">↗ Megosztás</span></button>
 <button id="aUpdate"><span class="fill"></span><span class="lbl">⟳ Frissítés</span></button>
 <div id="ver"></div>
</div>
<div id="toast"></div>
<div id="rot"><span>Fordítsd el a telefont fekvő helyzetbe ↻</span></div>
<script src="js/core.js"></script>
<script src="js/car.js"></script>
<script src="js/world.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
